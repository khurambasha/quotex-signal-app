name: Build Android APK

on:
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-latest
container: kivy/buildozer:latest

steps:
  - name: Get project files
    uses: actions/checkout@v4

  - name: Build APK
    run: yes | buildozer android debug

  - name: Save APK
    uses: actions/upload-artifact@v4
    with:
      name: quotex-signal-app-apk
      path: bin/*.apk
